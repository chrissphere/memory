<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="记忆训练">
  <meta name="theme-color" content="#4A7CFF">
  <title>多目标追踪</title>
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <script>screen.orientation?.lock('portrait').catch(()=>{})</script>
  <link rel="stylesheet" href="style.css">
  <style>
    .speed-btn {
      flex: 1;
      padding: 10px 0;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.15s ease;
    }
    .speed-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }
    .speed-group {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 360px;
    }
    .phase-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      min-height: 24px;
    }
    .countdown {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      min-height: 40px;
      font-variant-numeric: tabular-nums;
    }
    #game-canvas {
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow-md);
      display: block;
      touch-action: manipulation;
    }
    .btn-confirm {
      width: 100%;
      max-width: 420px;
      padding: 15px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      touch-action: manipulation;
      margin-top: 12px;
      transition: opacity 0.15s ease;
    }
    .btn-confirm:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .result-big {
      font-size: 72px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: -2px;
      line-height: 1;
      text-align: center;
    }
    .result-pct {
      font-size: 24px;
      font-weight: 700;
      color: var(--success);
      text-align: center;
      margin-top: 4px;
    }
    #chart-canvas {
      border-radius: var(--radius-sm);
      background: var(--card);
      display: block;
      margin: 0 auto;
    }
    .chart-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
<div id="rotate-overlay">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="2" width="8" height="18" rx="2"/>
    <path d="M4 10L2 8l2-2"/><line x1="2" y1="8" x2="8" y2="8"/>
  </svg>
  请旋转至竖屏
</div>

<!-- 主页 -->
<div id="screen-home" class="screen active">
  <div class="home-header">
    <a href="index.html" class="btn-nav-back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      首页
    </a>
    <h1 class="app-title">多目标追踪</h1>
    <p class="app-subtitle">注意力追踪训练</p>
  </div>

  <div class="setting-row">
    <span class="setting-label">总球数</span>
    <input type="number" id="input-balls" class="num-input" min="4" max="20" value="8">
  </div>

  <div class="setting-row">
    <span class="setting-label">目标数</span>
    <input type="number" id="input-targets" class="num-input" min="1" max="5" value="3">
  </div>

  <div class="setting-row">
    <span class="setting-label">追踪时长</span>
    <div style="display:flex;align-items:center;gap:6px;">
      <input type="number" id="input-duration" class="num-input" min="3" max="15" value="5">
      <span style="font-size:13px;color:var(--text-secondary);">秒</span>
    </div>
  </div>

  <div class="setting-row">
    <span class="setting-label">深色模式</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggle-theme">
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span class="setting-label">移动速度</span>
  </div>
  <div class="speed-group" style="margin-bottom:24px;">
    <button class="speed-btn" data-speed="slow">慢</button>
    <button class="speed-btn active" data-speed="medium">中</button>
    <button class="speed-btn" data-speed="fast">快</button>
  </div>

  <div class="stats-card" id="home-stats">
    <div class="stat-item">
      <span class="stat-value" id="stat-best">--</span>
      <span class="stat-label">最佳正确率</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-value" id="stat-avg">--</span>
      <span class="stat-label">平均正确率</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-value" id="stat-count">0</span>
      <span class="stat-label">完成次数</span>
    </div>
  </div>

  <button class="btn-start" id="btn-start">开始训练</button>
  <div class="tip-text">盯住高亮球，用余光追踪</div>
</div>

<!-- 游戏页 -->
<div id="screen-game" class="screen" style="padding-bottom:env(safe-area-inset-bottom,24px);">
  <div class="game-header">
    <button class="btn-back" id="btn-back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="phase-label" id="phase-label"></div>
    <div class="countdown" id="countdown"></div>
  </div>
  <div class="grid-wrap">
    <canvas id="game-canvas"></canvas>
  </div>
  <button class="btn-confirm" id="btn-launch" style="display:none;margin:12px 20px 20px;">开始追踪</button>
  <button class="btn-confirm" id="btn-confirm" style="display:none;margin:12px 20px 20px;" disabled>确认答案</button>
</div>

<!-- 结果页 -->
<div id="screen-result" class="screen">
  <div class="result-content">
    <div class="result-icon">🎯</div>
    <div class="result-big" id="result-correct">3/3</div>
    <div class="result-pct" id="result-pct">100%</div>
    <div class="result-label" id="result-duration">追踪时长 5.0s</div>

    <div class="result-stats" style="flex-direction:column;gap:12px;padding:16px 20px;">
      <p class="chart-label">历史正确率趋势</p>
      <canvas id="chart-canvas" width="280" height="100"></canvas>
    </div>

    <button class="btn-start" id="btn-again">再来一次</button>
    <button class="btn-outline" id="btn-home">返回主页</button>
  </div>
</div>

<script src="tracking.js"></script>
</body>
</html>
